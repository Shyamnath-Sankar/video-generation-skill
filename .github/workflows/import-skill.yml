name: import-skill
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify, extract, commit skill contents
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/yt-video-skill.zip "https://github.com/${{ github.repository }}/releases/download/v1.0.0/yt-video-skill.zip"
          echo "452d5138179f5db3780eb5a2f82903ad1b966c9e6cb293e4ce3fe649b76ac851  /tmp/yt-video-skill.zip" | sha256sum -c -
          rm -rf /tmp/skill && mkdir -p /tmp/skill
          unzip -q /tmp/yt-video-skill.zip -d /tmp/skill
          rsync -a /tmp/skill/ "$GITHUB_WORKSPACE/"
          git config user.name "Shyamnath-Sankar"
          git config user.email "Shyamnath-Sankar@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Import yt-video skill contents (extracted from original zip)"
          git push
